<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Projeto na Nuvem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Painel de Controle</h1>
        <p class="subtitle">Aprendendo computação em nuvem do zero ao deploy</p>

        <!-- Formulário para envio de dados -->
        <form id="itemForm">
            <div class="input-group">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" placeholder="Ex: Estudar Docker" required>
            </div>
            <div class="input-group">
                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" placeholder="Ex: Praticar comandos básicos" required>
            </div>
            <button type="submit">Adicionar Item</button>
        </form>

        <!-- Seção onde os itens cadastrados vão aparecer -->
        <div class="list-section">
            <h2>Itens Cadastrados</h2>
            <ul id="itemList">
                <!-- Os dados virão do JavaScript / Banco de Dados -->
                <li class="empty-message">Nenhum item carregado ainda.</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
